// ---------- FIX #1: ensurePhotos always calls callback ----------
async function loadPhotos(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('user_profiles').select('id, name, avatar_url');
    if(error || !data) return;
    data.forEach(p => {
      if(!p.avatar_url) return;
      if(p.name) PHOTOS[p.name.toLowerCase().trim()] = p.avatar_url;
      if(p.id)   PHOTOS[String(p.id).toLowerCase()] = p.avatar_url;
    });
  }catch(e){ console.warn('photos load:', e && e.message); }
}
function ensurePhotos(cb){
  if(!sb){ if(cb) cb(); return; }
  if(_photosLoaded){ if(cb) cb(); return; }
  loadPhotos().then(() => { _photosLoaded = true; if(cb) cb(); });
}

    system:'player', rank:'unranked', warn_pts:0, trust_pts:0,

  await loadStaffPool();
  renderPools();
};

// ---------- FIX #4: preserve steps/comments when moving active -> inbox ----------
const originalMtKanbanDrop = window.mtKanbanDrop;
window.mtKanbanDrop = function(e, col){
  if(!window.mtKDrag) return;
  const { type, id } = window.mtKDrag;
  let carry = null;
  if(type === 'active'){
    const it = window.MT_ACTIVE.find(x => x.id === id);
    if(it) carry = { steps: it.steps || [], comments: it.comments || [], priority: it.priority, title: it.title };
  }
  originalMtKanbanDrop(e, col);
  if(col === 'inbox' && carry && type === 'active'){
    const newItem = window.MT_INBOX.find(x => x.text === carry.title);
    if(newItem && (carry.steps.length || carry.comments.length)){
      newItem._steps = carry.steps;
      newItem._comments = carry.comments;
    }
  }
};

// ---------- Normalize PCs (original) ----------
function normalizePCs(){
  if(!Array.isArray(PCS)) PCS = [];
  PCS.forEach(p => {
    if(!p || typeof p !== 'object') return;
    if(!Array.isArray(p.assignments)) p.assignments = [];
    if(!Array.isArray(p.clients)) p.clients = [];
    if(p.leader === undefined) p.leader = null;
    if(!p.status) p.status = 'online';
    p.assignments.forEach(a => {
      if(a && typeof a === 'object'){
        if(typeof a.len !== 'number' || isNaN(a.len)) a.len = Number(a.len) || 0;
        if(typeof a.start !== 'number' || isNaN(a.start)) a.start = Number(a.start) || 0;
      }
    });
  });
}

// ---------- Load staff pool with merge (fix) ----------
async function loadStaffPool(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('staff_state').select('data').eq('id','pool').maybeSingle();
    if(error || !data || !data.data) return;
    const remoteStaff = data.data;
    const localIds = new Set(STAFF.map(s => s.id));
    const remoteIds = new Set(remoteStaff.map(s => s.id));
    const merged = [...remoteStaff];
    STAFF.forEach(s => { if(!remoteIds.has(s.id)) merged.push(s); });
    STAFF.length = 0;
    merged.forEach(s => STAFF.push(s));
  }catch(e){ console.warn('staff pool load failed:', e); }
}
