async function loadPhotos(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('user_profiles').select('id, name, avatar_url');

    data.forEach(p => {

// ---------- FIX #2: Staff added via onboarding persist to Supabase ----------
async function registerToStaff(){
  const a = APPLICANTS.find(x => x.id === onboardingApplicantId);
  if(!a) return;
  const st = window.obState || { shift:'night', days:6, hours:12 };
  const newId = 's_' + a.name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8) + '_' + Date.now().toString().slice(-4);
  const staffObj = {
    id: newId,
    name: a.name.split(' ')[0],
    full_name: a.name,
    position: 'unranked',
    work_days: 6,
    shiftLen: st.hours,
    break_hours: 1,
    day_off: false,
    monthly_salary: st.hours === 12 ? 3500000 : st.hours === 10 ? 3000000 : 2500000,
    probation: true,
    pref_shift: st.shift,
    is_new: true,
    joined_at: new Date().toISOString().slice(0,10)
  };
  STAFF.push(staffObj);
  // ** PERSIST to Supabase **
  if(sb){
    try{
      // Insert into a dedicated 'staff_pool' table (or user_profiles if they have an account)
      // For demo, we store in 'staff_state' as a separate array.
      const { error } = await sb.from('staff_state').upsert({ id:'pool', data: STAFF, updated_at: new Date().toISOString() });
      if(error) console.warn('Failed to persist staff pool:', error.message);
    }catch(e){ console.warn(e); }
  }
  TRUST_DATA[a.name.toLowerCase().split(' ')[0]] = {
    system: 'player', rank: 'unranked',
    warn_pts: 0, trust_pts: 0,
    protected_until: new Date(Date.now() + 7*86400000).toISOString().slice(0,10),
    incidents: [], trust_earned: []
  };
  a.staff_registered = true;
  a.staff_id = newId;
  closeOnboarding();
  toast(`🚀 ${a.name.split(' ')[0]} 직원 풀 등록 완료 (주6일·${st.hours}H) — PC 현황에서 시프트 배정 가능`);
  renderRecruit();
  // reload staff pool so it appears immediately
  await loadStaffPool(); // will now merge local + remote
  renderPools();
}

// ---------- FIX #2b: loadStaffPool merges instead of overwriting ----------
async function loadStaffPool(){
  if(!sb) return;
  try{
    const { data, error } = await sb.from('staff_pool').select('data').eq('id','default').maybeSingle();
    if(error || !data || !data.data) return;
    const remoteStaff = data.data;
    // merge: keep local staff that are not in remote (e.g., newly added)
    const localIds = new Set(STAFF.map(s => s.id));
    const remoteIds = new Set(remoteStaff.map(s => s.id));
    const merged = [...remoteStaff];
    STAFF.forEach(s => { if(!remoteIds.has(s.id)) merged.push(s); });
    STAFF.length = 0;
    merged.forEach(s => STAFF.push(s));
  }catch(e){ console.warn('staff pool load failed:', e); }
}

// ---------- FIX #5: Preserve steps & comments when moving active -> inbox ----------
function mtKanbanDrop(e, col){
  e.preventDefault();
  e.currentTarget.classList.remove('mt-kcol-over');
  if(!mtKDrag) return;
  const { type, id } = mtKDrag;
  mtKDrag = null;
  const me = window.mtViewingMember || currentUser?.name || 'MT';
  let title = '', owner = me, carry = null;
  if(type === 'active'){
    const it = MT_ACTIVE.find(x => x.id === id);
    if(!it){ renderMTSystem(); return; }
    if(col === 'active'){ if(it.status === 'done'){ it.status = 'todo'; it.done_at = null; saveMTSystem(); } renderMTSystem(); return; }
    if(col === 'done'){ it.status = 'done'; it.done_at = isoDate(new Date()); saveMTSystem(); renderMTSystem(); return; }
    title = it.title;
    owner = it.owner || me;
    carry = { steps: it.steps || [], comments: it.comments || [], priority: it.priority };
    MT_ACTIVE = MT_ACTIVE.filter(x => x.id !== id);
  } else if(type === 'inbox'){
    const it = MT_INBOX.find(x => x.id === id);
    if(!it){ renderMTSystem(); return; }
    if(col === 'inbox'){ renderMTSystem(); return; }
    title = it.text; owner = it.owner || me;
    MT_INBOX = MT_INBOX.filter(x => x.id !== id);
  } else {
    renderMTSystem(); return;
  }
  if(col === 'inbox'){
    MT_INBOX.push({ id:Date.now(), text:title, created_at:isoDate(new Date()), owner });
  } else if(col === 'passive'){
    const newId = Math.max(0, ...MT_PASSIVE.map(p=>p.id)) + 1;
    MT_PASSIVE.push({ id:newId, title, category:'Operation', priority:(carry&&carry.priority)||'P2', owner, status:'active', created_at:isoDate(new Date()) });
    mtExpandedPassive.add(newId);
  } else if(col === 'active'){
    const newId = Math.max(100, ...MT_ACTIVE.map(a=>a.id)) + 1;
    MT_ACTIVE.push({ id:newId, title, passive_id:null, owner,
      priority:(carry&&carry.priority)||'P2',
      status:'todo', due:null,
      steps: carry && carry.steps ? carry.steps : [],
      comments: carry && carry.comments ? carry.comments : [],
      created_at:isoDate(new Date()) });
  }
  saveMTSystem();
  renderMTSystem();
}

}
